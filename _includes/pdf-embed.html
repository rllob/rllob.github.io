{% comment %}
Inline PDF viewer with a link fallback.

Usage: {% include pdf-embed.html url="https://rllob.github.io/files/paper.pdf" label="Paper title" %}

<object> renders the PDF where the browser supports it and falls back to the
paragraph inside when it does not, which is the common case on phones.
{% endcomment %}
<div class="pdf-embed">
  <object data="{{ include.url }}#view=FitH" type="application/pdf" aria-label="{{ include.label | default: 'PDF' }}">
    <p class="pdf-embed__fallback">This browser cannot show the PDF here. <a href="{{ include.url }}">Open it in a new tab</a> instead.</p>
  </object>
</div>
<p class="pdf-embed__links">
  <a href="{{ include.url }}" target="_blank" rel="noopener">Open in a new tab</a>
  <a href="{{ include.url }}" download>Download a copy</a>
</p>
